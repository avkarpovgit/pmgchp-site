name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Валидация данных мониторинга
        run: python3 scripts/validate_monitoring.py

      - run: npm ci

      - name: Тайп-чек (astro check)
        run: npm run check

      - run: npm run build

      - name: Smoke-проверка сборки
        run: python3 scripts/check_dist.py

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pmgchp.ru
