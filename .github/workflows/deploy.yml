name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # ежедневно в 05:00 UTC (08:00 МСК) — проверка новых выпусков мониторинга
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Обновить мониторинг из телеграм-канала
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/update_monitoring.py
          python3 scripts/validate_monitoring.py
          if ! git diff --quiet src/data/monitoring.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/monitoring.json
            git commit -m "Мониторинг: новые выпуски из канала (авто)"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Валидация данных мониторинга
        run: python3 scripts/validate_monitoring.py

      - run: npm ci

      - run: npm run build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pmgchp.ru
