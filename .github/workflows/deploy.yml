name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    # ежедневно в 05:00 UTC (08:00 МСК) — проверка новых выпусков мониторинга
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Обновить мониторинг из телеграм-канала
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          python3 scripts/update_monitoring.py --selftest
          python3 scripts/update_monitoring.py
          python3 scripts/validate_monitoring.py
          if ! git diff --quiet src/data/monitoring.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/monitoring.json
            git commit -m "Мониторинг: новые выпуски из канала (авто)"
            git push
          fi

      - name: Обновить статусы законопроектов (СОЗД)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          DUMA_PROXY: ${{ secrets.DUMA_PROXY }}
        run: |
          python3 -m pip install --quiet --user pyyaml || true
          python3 scripts/update_bills.py --selftest
          python3 scripts/update_bills.py || true
          if ! git diff --quiet src/content/bills/; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/content/bills/
            git commit -m "Законопроекты: обновление статусов с СОЗД (авто)"
            git push
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Валидация данных мониторинга
        run: python3 scripts/validate_monitoring.py

      - run: npm ci

      - name: Тайп-чек (astro check)
        run: npm run check

      - run: npm run build

      - name: Smoke-проверка сборки
        run: python3 scripts/check_dist.py

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          cname: pmgchp.ru
